# Upstream MCP servers that Patient Zero protects (used by `pz serve`).
# Each one is started as a subprocess and talked to over stdio.
servers:
  filesystem:
    command: npx
    args: ["-y", "@modelcontextprotocol/server-filesystem", "/path/to/allowed/folder"]
